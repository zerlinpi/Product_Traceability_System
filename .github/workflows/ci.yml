name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: nothing in this workflow writes back to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check .

  permission-matrix:
    name: Permission matrix is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # docs/PERMISSION_MATRIX.md is generated from app.py. Without this check a
      # route added without re-running --sync makes the security documentation
      # quietly wrong, and the documentation is what a reviewer actually reads.
      - name: Verify docs/PERMISSION_MATRIX.md
        run: python tools/extract_routes.py --check

  docs-consistency:
    name: Docs match the code
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth of 1. One of the checks asks git
      # whether a path a document references was ever deleted; on a shallow clone
      # that question always answers no, and the check would pass by being unable
      # to see anything — a silent no-op, which is worse than no check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # PERMISSION_MATRIX.md is generated and cannot drift. Everything else is
      # hand-written and did drift during the blueprint refactor: the architecture
      # doc still said user_version 21 after v22 shipped, API_CONTRACT still split
      # the route count as "app.py 100 + auth.py 7" after nine blueprints moved
      # out, SECURITY called the systemd sandbox unenabled when it was already on,
      # and the README advertised Python 3.11+ while CI only ran 3.13.
      #
      # Each is cheap to fix and expensive to miss, so it fails the build now.
      - name: Verify docs describe the current system
        run: python tools/check_docs_consistency.py

  frontend:
    name: Frontend (typecheck, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from frontend/package.json's packageManager field
      # rather than a literal here: a second copy is a second thing to forget.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile, never a plain install: an install that is allowed to
      # rewrite the lockfile would make CI pass on a dependency set nobody
      # committed, and the drift would only surface on the next clean checkout.
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      # Checked BEFORE the build, because the build wipes static/dist
      # (emptyOutDir) and would take build-info.json with it. The bundle is
      # committed because the factory server has no Node toolchain, which means a
      # developer can edit frontend/, build locally, and commit only the source —
      # leaving the repository serving a bundle without their change. Nothing else
      # would notice: the Python tests assert against whatever static/dist holds.
      #
      # This compares a fingerprint of the build inputs, not the build output. The
      # output is not byte-reproducible: UnoCSS emits its theme custom properties
      # in a non-deterministic order, so two builds of identical sources differ by
      # a couple of swapped lines inside :root. See tools/check_frontend_build.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Committed bundle was built from this source
        run: python tools/check_frontend_build.py

      # Proves the source actually compiles. The result is discarded; CI never
      # commits generated files, because a pipeline that pushes build output makes
      # every run a possible conflict and every no-op run an unreviewable diff.
      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Install the backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # tools/dev_server.py is the project's own way to run a seeded server
      # against a throwaway database: it never touches data/traceability.db and
      # refuses to start under PTS_ENV=production. The e2e defaults (port 5090,
      # admin credentials) match what it seeds, so no configuration is invented
      # here that the developer does not also use.
      - name: Start the server
        run: |
          nohup python tools/dev_server.py --port 5090 > dev-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5090/api/health > /dev/null; then
              echo "server ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy; log follows" >&2
          cat dev-server.log >&2
          exit 1

      # Ubuntu only. The smoke test drives the built UI in a browser; that
      # behaviour does not vary by platform, so repeating it on Windows would
      # double the slowest job to learn nothing. The Python suite still runs on
      # both, which is where the platform assumptions actually live.
      - name: End-to-end smoke test
        working-directory: frontend
        env:
          # playwright-core ships no browsers; the runner's Chrome is the one to
          # use. The script defaults to msedge, which does not exist on Linux.
          PTS_BROWSER: chrome
        run: pnpm e2e

      - name: Server log on failure
        if: failure()
        run: |
          {
            echo "## dev server log"
            echo '```'
            tail -80 dev-server.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the deployment target for the factory server; Linux is the
        # supported alternative (install-linux.sh). Running both catches
        # platform assumptions rather than discovering them on the shop floor.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Deleting a failing test is the easiest way to make a red build green.
      # This turns it into a second, louder failure.
      - name: Guard against test-count regression
        run: python tools/check_test_count.py

      # The floor is a ratchet, not a target. Measured on Windows (the
      # deployment target) the suite covers 84.5%; 82 leaves headroom for
      # branches that only execute on one platform — ble_collector.py has
      # Windows-only paths, so Linux runs score a little lower. Raise it as
      # coverage improves; lowering it needs a reason.
      #
      # Output is teed to a file so the failure step below can surface it. Job
      # logs need repository admin rights to read through the API, which makes a
      # cross-platform failure hard to diagnose from outside; the step summary
      # is readable by anyone who can see the run.
      - name: pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests -q \
            --junitxml=pytest-report.xml \
            --cov=app --cov=traceability --cov=manage --cov=tools \
            --cov-report=term-missing \
            --cov-fail-under=82 2>&1 | tee pytest-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Surface the failures
        if: failure()
        shell: bash
        run: |
          {
            echo "## pytest failures"
            echo ""
            echo "### Failing tests"
            echo '```'
            grep -E "^(FAILED|ERROR)" pytest-output.txt | head -50 || true
            echo '```'
            echo "### Tail of the run"
            echo '```'
            tail -150 pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations render on the run page and in the PR checks view, so a
          # failure is diagnosable without downloading anything. One ::error::
          # per line — GitHub does not accept newlines inside a command.
          echo "--- failing tests ---"
          grep -E "^(FAILED|ERROR)" pytest-output.txt | head -20 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          echo "--- first failure detail ---"
          awk '/^=+ FAILURES =+$/{flag=1} /^=+ short test summary/{flag=0} flag' pytest-output.txt \
            | grep -E "^(E |_{5,}|tests/|> |AssertionError|[a-zA-Z_]+Error)" \
            | head -25 | while IFS= read -r line; do
            echo "::error title=pytest detail::$line"
          done

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: |
            pytest-report.xml
            pytest-output.txt
          if-no-files-found: warn
